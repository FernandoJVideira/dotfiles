# The Gitea server's SSH key comes from the Proton Pass agent (socket below, serving the "SSH" vault),
# not from a key file, so there is deliberately no IdentityFile line: ssh adds every IdentityFile it
# finds across matching blocks, and a file key would be offered alongside the agent's. The tunnel goes
# through Cloudflare Access; cloudflared is installed on every OS by mise.
Host git.fernandovideira.com
  ProxyCommand cloudflared access ssh --hostname gitea.fernandovideira.com
  IdentityAgent ~/.ssh/proton-pass-agent.sock
