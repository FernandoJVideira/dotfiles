# The vue-ui-kit repo's deploy key lives in the Proton Pass "Deploy" vault and is served by a second
# agent (proton-pass-deploy-agent; its socket is below). The main agent serves only the "SSH" vault,
# so GitHub is never offered a repo-scoped key ahead of the account key. ssh takes the first value
# it finds for an option, and ~/.ssh/config includes this directory at the top, so these lines win
# over any older Host block of the same name in that file.
Host vue-ui-kit-deploy
  HostName github.com
  User git
  IdentityAgent ~/.ssh/proton-deploy-agent.sock
  IdentitiesOnly no
