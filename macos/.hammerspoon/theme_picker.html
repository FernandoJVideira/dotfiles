<!doctype html>
<html class="/*MODE*/dark">
<head>
<meta charset="utf-8">
<style>
:root {
  /*VARS*/
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

html, body {
  height: 100%;
  background: transparent;
  overflow: hidden;
  font: 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: rgb(var(--fg));
}

/* Two pieces of glass, like Spotlight: a search pill and, below it, the results. The window is bigger
   than they are by 56px on every side, which holds their shadows (a shadow the window cuts off shows
   as a hard edge). */
.stage {
  position: absolute;
  top: 56px;
  left: 56px;
  right: 56px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* a tint of the theme's background, a sheen from the top left, a bright rim along the top edge and a
   soft one along the bottom, and a shadow */
.glass {
  position: relative;
  background:
    radial-gradient(120% 90% at 6% -20%, rgba(255, 255, 255, var(--sheen)) 0%, rgba(255, 255, 255, 0) 62%),
    linear-gradient(170deg, rgba(var(--bg), 0.84), rgba(var(--bg), 0.72));
  border: 1px solid rgba(255, 255, 255, var(--rim));
  box-shadow:
    0 20px 40px rgba(0, 0, 0, 0.36),
    0 2px 8px rgba(0, 0, 0, 0.22),
    inset 0 1.5px 1px rgba(255, 255, 255, var(--rim-top)),
    inset 0 -1px 1px rgba(255, 255, 255, 0.14),
    inset 0 0 30px rgba(255, 255, 255, 0.04);
  -webkit-backdrop-filter: blur(40px) saturate(1.8);
  backdrop-filter: blur(40px) saturate(1.8);
}

.pill {
  height: 86px;
  border-radius: 43px;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 36px 0 38px;
}
#q {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  color: inherit;
  font: 300 33px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  letter-spacing: -0.012em;
  caret-color: rgb(var(--accent));
  -webkit-user-select: text; user-select: text;
}
#q::placeholder { color: rgba(var(--fg), 0.40); }
.pill svg { flex: none; opacity: 0.55; }

.panel {
  border-radius: 40px;
  padding: 14px;
}
.list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 508px;
  overflow-y: auto;
  scrollbar-width: none;
}
.list::-webkit-scrollbar { display: none; }

.row {
  flex: none;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 60px;
  padding: 0 26px 0 12px;
  border-radius: 28px;
  border: 1px solid transparent;
}
.row.sel {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0) 55%),
    rgba(var(--accent), 0.30);
  border-color: rgba(255, 255, 255, 0.22);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.34),
    0 6px 16px rgba(var(--accent), 0.18);
}

.thumb {
  flex: none;
  width: 66px;
  height: 41px;
  border-radius: 10px;
  background-size: cover;
  background-position: center;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.20), 0 3px 9px rgba(0, 0, 0, 0.32);
}

.text { flex: 1; min-width: 0; }
.name { font-size: 21px; font-weight: 500; letter-spacing: -0.008em; }
.meta { margin-top: 1px; font-size: 12.5px; opacity: 0.5; }

.tag {
  flex: none;
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: rgba(var(--accent), 0.28);
  border: 1px solid rgba(255, 255, 255, 0.22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
}

.key {
  flex: none;
  min-width: 40px;
  text-align: right;
  font: 400 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  letter-spacing: 0.02em;
  opacity: 0.34;
}

.empty { padding: 30px 0; text-align: center; font-size: 17px; opacity: 0.45; }
</style>
</head>
<body>
<div class="stage">
  <div class="glass pill">
    <input id="q" type="text" placeholder="Pick a theme" autocomplete="off" spellcheck="false" autofocus>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.8-1.7H16a5 5 0 0 0 5-5c0-3.9-4-7.2-9-7.2Z"/>
      <circle cx="7.6" cy="11.2" r="1.1"/><circle cx="10.4" cy="7.2" r="1.1"/><circle cx="15" cy="7.4" r="1.1"/>
    </svg>
  </div>
  <div class="glass panel">
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const items = /*DATA*/ null;

const list = document.getElementById("list");
const input = document.getElementById("q");
let visible = [];
let sel = 0;

function post(message) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.picker) {
    window.webkit.messageHandlers.picker.postMessage(message);
  }
}

// every typed character has to appear in the name, in order ("gbx" finds gruvbox)
function matches(query, text) {
  let i = 0;
  for (const ch of text) {
    if (ch === query[i]) i++;
    if (i === query.length) return true;
  }
  return query.length === 0;
}

function filter() {
  const query = input.value.trim().toLowerCase();
  visible = items.filter(item => matches(query, item.name.toLowerCase()) || item.mode.startsWith(query));
}

function render() {
  list.innerHTML = "";
  if (visible.length === 0) {
    list.innerHTML = '<div class="empty">No theme matches</div>';
    return;
  }
  visible.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "row" + (index === sel ? " sel" : "");
    row.innerHTML =
      '<div class="thumb"></div>' +
      '<div class="text"><div class="name"></div><div class="meta"></div></div>' +
      (item.current ? '<div class="tag">current</div>' : "") +
      (index < 9 ? '<div class="key">⌘' + (index + 1) + "</div>" : "");
    row.querySelector(".thumb").style.backgroundImage = 'url("' + item.thumb + '")';
    row.querySelector(".name").textContent = item.name;
    row.querySelector(".meta").textContent = item.mode;
    row.addEventListener("click", () => pick(index));
    row.addEventListener("mousemove", () => { if (sel !== index) { sel = index; mark(); } });
    list.appendChild(row);
  });
  reveal();
}

function mark() {
  [...list.children].forEach((row, index) => row.classList.toggle("sel", index === sel));
}

function reveal(block) {
  const row = list.children[sel];
  if (row && row.scrollIntoView) row.scrollIntoView({ block: block || "nearest" });
}

function move(delta) {
  if (visible.length === 0) return;
  sel = (sel + delta + visible.length) % visible.length;
  mark();
  reveal();
}

function pick(index) {
  const item = visible[index];
  if (item) post({ action: "pick", name: item.name });
}

input.addEventListener("input", () => { filter(); sel = 0; render(); });

document.addEventListener("keydown", event => {
  const key = event.key;
  if (key === "Escape") { post({ action: "close" }); event.preventDefault(); return; }
  if (key === "Enter") { pick(sel); event.preventDefault(); return; }
  if (key === "ArrowDown" || (event.ctrlKey && (key === "n" || key === "j"))) { move(1); event.preventDefault(); return; }
  if (key === "ArrowUp" || (event.ctrlKey && (key === "p" || key === "k"))) { move(-1); event.preventDefault(); return; }
  if (event.metaKey && /^[1-9]$/.test(key)) { pick(Number(key) - 1); event.preventDefault(); }
});

window.focusSearch = () => input.focus();

filter();
sel = Math.max(0, visible.findIndex(item => item.current));
render();
reveal("center");
input.focus();
</script>
</body>
</html>
