# macOS keeps Gruvbox for now (matches macos/.config/kitty/theme.conf). Linux has no
# such file, so there the status line in tmux.conf - plain ANSI colors - follows the
# terminal palette, which Omadora re-renders on every theme change.
# Sourced from tmux.conf just before TPM starts; TPM reads sourced files too, so the
# plugin is only installed and loaded where this file is linked.
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
