# macOS variant of common/.config/zsh/starship.toml (itself ported from
# end4-pC / illogical-impulse): identical layout and glyphs, but the fixed
# light-gray ANSI-256 pill colors are swapped for Gruvbox Dark hex values so
# the prompt fits this machine's Gruvbox theme (kitty, Zed, nvim, tmux,
# sketchybar). Linux keeps the gray pills since its terminal palette is dynamic.
# .zshenv points STARSHIP_CONFIG here when this file exists.

# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#928374'

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[ ](bold fg:#b8bb26)"
error_symbol = "[ ](bold fg:#fb4934)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:#689d6a"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#689d6a)[$symbol $branch(:$remote_branch)](fg:#282828 bg:#689d6a)[ ](bold fg:#689d6a)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:#a89984 bold fg:#282828)[](bold fg:#a89984)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#a89984 fg:#282828"
style_root = "red bold"
format = "[](bold fg:#a89984)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#504945 fg:#ebdbb2"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#504945)[󰉋 → $path]($style)[](bold fg:#504945)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#d79921)[󰪢 $duration](bold bg:#d79921 fg:#282828)[](bold fg:#d79921)'
