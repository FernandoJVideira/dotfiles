# Static styling ported from end4-pC's kitty.conf (used on the Nobara
# machine) - font/cursor/padding/keybinds only, same subset as
# linux/arch/.config/kitty/kitty.conf for consistency across all three
# machines. Colors follow the active theme: the `theme` command (macos/.local/bin/theme)
# renders this file from Omadora's kitty template and reloads every running kitty,
# same as `omactl theme set` on Linux.
include ~/.config/omadora/current/theme/kitty.conf

# Font. macOS needs the exact CoreText family name (fontconfig on Linux ignores
# spaces, so end4-pC's "JetBrains Mono Nerd Font" works there but silently falls
# back to Menlo here, squashing the Nerd Font icons). The "Mono" variant is the
# one with single-cell icons, which terminals need.
font_family      JetBrainsMono Nerd Font Mono
font_size 14.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No title bar / traffic lights (macOS). titlebar-only keeps the rounded corners and the
# shadow, which `yes` would drop. Hyprspace tiles the windows, so nothing needs dragging
# by the title bar; cmd+ctrl+drag still moves a window if it ever does.
hide_window_decorations titlebar-only

# Slight transparency + blur (blur only takes effect when opacity < 1)
background_opacity 0.92
background_blur 24

# No stupid close confirmation
confirm_os_window_close 0

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
