# Gaming tweaks Nobara ships that stock Fedora does not: split-lock slowdown off, Star Citizen/Uplay needs.
kernel.split_lock_mitigate = 0
# Fedora sets 1048576 (10-map-count.conf); Star Citizen and some Proton games want this higher.
vm.max_map_count = 16777216
# Uplay/Ubisoft Connect network stalls (from Nobara's nobara-login-sysctl).
net.ipv4.tcp_mtu_probing = 1
