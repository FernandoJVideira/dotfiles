# Static styling ported from end4-pC's kitty.conf - font/cursor/padding/
# keybinds only. Colors follow the active Omadora theme: `omactl theme set`
# re-renders this file from default/themed/kitty.conf.tpl and reloads every
# running kitty.
include ~/.config/omadora/current/theme/kitty.conf

# Transparency - Hyprland blurs whatever is behind the translucent window
# (decoration.blur in looknfeel.lua), so no kitty-side blur is needed.
background_opacity 0.80
dynamic_background_opacity yes
map ctrl+shift+a>m change_background_opacity +0.05
map ctrl+shift+a>l change_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default


# Font
font_family      JetBrainsMono Nerd Font Mono
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
