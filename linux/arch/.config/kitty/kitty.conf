# Static styling ported from end4-pC's kitty.conf (used on the Nobara
# machine) - font/cursor/padding/keybinds only. Colors come from Omarchy's
# own theme system instead of end4-pC's matugen pipeline (Omarchy already
# ships default/themed/kitty.conf.tpl and regenerates it on every
# `omarchy theme set`), which is why the include below points there rather
# than at end4-pC's Quickshell-generated path.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
