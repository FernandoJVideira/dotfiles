<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Dank Mono first for "monospace". Read before Skein's ~/.config/fontconfig/fonts.conf, whose
     strong assign then turns the remaining "monospace" into JetBrains Mono: that stays the fallback
     when Dank Mono isn't installed or lacks a glyph. -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Dank Mono</string>
    </edit>
  </match>
</fontconfig>
